name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build backend and frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Push placeholder deploy artifact
        run: echo "Deploy workflow completed. Configure registry/host secrets to publish images or deploy to your target platform."